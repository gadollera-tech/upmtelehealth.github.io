title: UP Manila National Telehealth Center
short_title: NTHC
description: Digital health research, standards, systems, capacity building, and partnerships for equitable health.
url: "https://gadollera-tech.github.io"
baseurl: "/upmtelehealth.github.io"
timezone: Asia/Manila
permalink: /news/:year/:month/:day/:title/
markdown: kramdown
exclude:
  - README.md
  - EDITOR-GUIDE.md
  - SOURCE-NOTES.md
  - templates
  - google-apps-script
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
plugins:
  - jekyll-feed
  - jekyll-seo-tag
