<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7b1113">
  <title>Thank You | UP Manila National Telehealth Center</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f8f1ee,#eef5f0);padding:24px}.thanks{max-width:650px;background:#fff;border:1px solid #ddd;border-radius:24px;padding:clamp(32px,6vw,64px);box-shadow:var(--shadow);text-align:center}.thanks-mark{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;margin:0 auto 24px;background:var(--green);color:#fff;font-size:2rem}.thanks h1{font-size:clamp(2.2rem,6vw,4rem)}.thanks p{color:var(--muted);font-size:1.05rem}.thanks .button{margin-top:18px}
  </style>
</head>
<body>
  <main class="thanks">
    <div class="thanks-mark" aria-hidden="true">✓</div>
    <p class="eyebrow">Submission received</p>
    <h1>Thank you for connecting with NTHC.</h1>
    <p>Your information has been submitted. The appropriate team may follow up using the email address you provided.</p>
    <a class="button button--primary" href="index.html">Return to the website</a>
  </main>
</body>
</html>
