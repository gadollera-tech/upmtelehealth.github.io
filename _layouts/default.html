<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f6fb6">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="icon" href="{{ '/assets/images/nthc-seal.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body class="page-{{ page.nav | default: 'home' }}">
  {% include header.html %}
  <main id="main">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/config.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
  {% if page.calendar %}<script src="{{ '/assets/js/calendar.js' | relative_url }}"></script>{% endif %}
</body>
</html>
